name: CI

on:
  push:
    branches:
    - infrastructure-layer

jobs:
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - run: npm ci
    - run: npm test

    - name: Generate tag
      id: generate_tag
      run: |
        SHA=$(echo $GITHUB_SHA | head -c7)
        echo "sha=$SHA" >> $GITHUB_OUTPUT

    - name: Login into the container registry
      uses: docker/login-action@v3.3.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    - name: Build docker image
      run: docker build -t arakakimath/first-project-ci-cd:${{ steps.generate_tag.outputs.sha }} .

    - name: Push image
      run: docker push arakakimath/first-project-ci-cd:${{ steps.generate_tag.outputs.sha }}